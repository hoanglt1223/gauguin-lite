<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Camera skin: Classic</title>
<link rel="stylesheet" href="assets/base.css">
<style>
/* Classic: pro-camera feel. Matte black, red accent, uppercase tracked labels, film-dial with fine ticks, square corners. */
.phone { --accent: #e0322b; --fg: #f2efe9; --muted: rgba(242,239,233,.55); --surface: #0b0b0b; --sheet-bg: #0e0e0e; --stroke: rgba(242,239,233,.16);
  --preview-inset: 96px 0 236px 0; --radius-s: 2px; --radius-m: 4px; --radius-l: 6px; --mode-font-size: 12px; --mode-spacing: .14em;
  --lens-bg: transparent; --lens-chip: #141414; --lens-chip-on: #141414; --chip-bg: #161616; --more-radius: 4px; --look-radius: 2px;
  --thumb-radius: 4px; --focus-radius: 0; --flip-bg: #161616; --switch-on: #e0322b;
  --dial-ticks: repeating-linear-gradient(90deg, rgba(242,239,233,.5) 0 1px, transparent 1px 7px);
  --font: "Manrope", system-ui, sans-serif; --dur-med: 200ms; --ease: cubic-bezier(.4,0,.2,1); }
.topbar { background: #000; }
.topbar .ic { color: var(--fg); }
.modes { bottom: 168px; }
.modes button.on { color: var(--fg); }
.modes button.on::after { content: ""; display: block; width: 4px; height: 4px; margin: 2px auto 0; border-radius: 50%; background: var(--accent); }
.lens { bottom: 244px; }
.lens button { border: 1px solid var(--stroke); }
.lens button.on { color: var(--fg); border-color: var(--accent); }
.shutter { border: 2px solid #f2efe9; --shutter: 74px; }
.shutter .core { background: #f2efe9; box-shadow: inset 0 0 0 3px #000; }
.phone[data-mode="Pro"] .shutter .core { background: var(--accent); }
.pro-panel { bottom: 236px; background: #000; border-top: 1px solid var(--stroke); }
.pro-tabs small { text-transform: uppercase; }
.dial { height: 64px; }
.dial-needle { height: 26px; width: 2px; }
.looks-strip { bottom: 300px; }
.sheet h3 { text-transform: uppercase; letter-spacing: .14em; font-size: 13px; color: var(--muted); }
.review-actions button { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
</style></head>
<body><h1 style="font-size:16px;margin:0">Classic</h1><div id="app"></div>
<script src="assets/camera-mock.js"></script><script>CameraMock.build(document.getElementById('app'), { name: 'Classic' });</script>
</body></html>
