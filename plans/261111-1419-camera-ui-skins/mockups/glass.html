<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Camera skin: Glass</title>
<link rel="stylesheet" href="assets/base.css">
<style>
/* Glass: full-bleed preview, translucent capsules, minimal chrome, title-case modes. */
.phone { --accent: #ffd60a; --surface: rgba(40,40,44,.42); --stroke: rgba(255,255,255,.22); --blur: 24px;
  --preview-inset: 0; --mode-case: none; --mode-spacing: 0; --mode-font-size: 14px;
  --lens-bg: rgba(255,255,255,.10); --lens-chip: transparent; --lens-chip-on: rgba(255,255,255,.18);
  --flip-bg: rgba(255,255,255,.16); --sheet-bg: rgba(30,30,34,.55); --chip-bg: rgba(255,255,255,.14); --switch-on: #34c759;
  --dur-med: 280ms; --ease: cubic-bezier(.25,.9,.3,1.05); }
.topbar { top: 44px; left: 70px; right: 70px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.10); backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.topbar .ic { width: 44px; height: 44px; }
.topbar .ic[data-act="ratio"], .topbar .ic[data-act="looks"] { display: none; }
.modes { bottom: 150px; }
.modes button.on { color: var(--accent); background: rgba(255,255,255,.12); backdrop-filter: blur(20px); }
.bottom { bottom: 30px; }
.shutter { --shutter: 78px; border: 3px solid rgba(255,255,255,.95); }
.thumb { --thumb-radius: 12px; }
.lens { bottom: 200px; }
.pro-panel { bottom: 190px; margin: 0 12px; border-radius: 24px; background: rgba(30,30,34,.45); backdrop-filter: blur(24px); }
.scene-chip { top: 100px; }
.rec-pill { top: 100px; }
.looks-strip { bottom: 260px; }
</style></head>
<body><h1 style="font-size:16px;margin:0">Glass</h1><div id="app"></div>
<script src="assets/camera-mock.js"></script><script>CameraMock.build(document.getElementById('app'), { name: 'Glass' });</script>
</body></html>
